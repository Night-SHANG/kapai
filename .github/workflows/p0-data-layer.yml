name: P0 Data Layer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "poc/data_layer/**"
      - "scripts/preflight/**"
      - ".github/workflows/p0-data-layer.yml"

jobs:
  p0-data-layer:
    name: Windows Godot 4.7.1
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Godot 4.7.1 stable
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $binary = (Resolve-Path "godot/Godot_v4.7.1-stable_win64.exe").Path
          "GODOT_EXE=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version

      - name: Run P0-1 automated bootstrap
        shell: pwsh
        run: |
          .\poc\data_layer\run_p0.ps1 -GodotExe "$env:GODOT_EXE"
